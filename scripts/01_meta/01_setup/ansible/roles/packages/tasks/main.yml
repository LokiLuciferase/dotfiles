---
- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: "{{ dotfiles_should_become }}"
  when:
    - dotfiles_can_install_system_packages | bool
    - dotfiles_effective_package_manager == "apt"


- name: Validate enabled package groups
  ansible.builtin.assert:
    that:
      - item in dotfiles_package_groups
    fail_msg: "Unknown package group: {{ item }}"
  loop: "{{ dotfiles_package_groups_enabled }}"


- name: Install selected system package groups
  ansible.builtin.include_tasks: install_system_group.yml
  loop: "{{ dotfiles_package_groups_enabled }}"
  loop_control:
    loop_var: dotfiles_package_group


# Collect IDs for package ecosystems which are not mutually exclusive
# system package managers. These are consumed below or by later roles.
- name: Initialize user package ID lists
  ansible.builtin.set_fact:
    dotfiles_pip_package_ids: []
    dotfiles_flatpak_package_ids: []
    dotfiles_cargo_package_ids: []


- name: Collect pip package IDs
  ansible.builtin.set_fact:
    dotfiles_pip_package_ids: >-
      {{
        dotfiles_pip_package_ids
        + (dotfiles_package_groups[item].pip | default([]))
      }}
  loop: "{{ dotfiles_package_groups_enabled }}"


- name: Collect Flatpak package IDs
  ansible.builtin.set_fact:
    dotfiles_flatpak_package_ids: >-
      {{
        dotfiles_flatpak_package_ids
        + (dotfiles_package_groups[item].flatpak | default([]))
      }}
  loop: "{{ dotfiles_package_groups_enabled }}"


- name: Collect Cargo package IDs
  ansible.builtin.set_fact:
    dotfiles_cargo_package_ids: >-
      {{
        dotfiles_cargo_package_ids
        + (dotfiles_package_groups[item].cargo | default([]))
      }}
  loop: "{{ dotfiles_package_groups_enabled }}"


- name: Normalize user package ID lists
  ansible.builtin.set_fact:
    dotfiles_pip_package_ids: >-
      {{ dotfiles_pip_package_ids | unique | list }}
    dotfiles_flatpak_package_ids: >-
      {{ dotfiles_flatpak_package_ids | unique | list }}
    dotfiles_cargo_package_ids: >-
      {{ dotfiles_cargo_package_ids | unique | list }}


- name: Validate pip package IDs
  ansible.builtin.assert:
    that:
      - item in dotfiles_pip_package_catalog
    fail_msg: "Unknown pip package ID: {{ item }}"
  loop: "{{ dotfiles_pip_package_ids }}"


- name: Validate Flatpak package IDs
  ansible.builtin.assert:
    that:
      - item in dotfiles_flatpak_package_catalog
    fail_msg: "Unknown Flatpak package ID: {{ item }}"
  loop: "{{ dotfiles_flatpak_package_ids }}"


- name: Validate Cargo package IDs
  ansible.builtin.assert:
    that:
      - item in dotfiles_cargo_package_catalog
    fail_msg: "Unknown Cargo package ID: {{ item }}"
  loop: "{{ dotfiles_cargo_package_ids }}"


# pip
- name: Install selected pip packages
  ansible.builtin.pip:
    name: >-
      {{
        dotfiles_pip_package_ids
        | map('extract', dotfiles_pip_package_catalog)
        | list
      }}
    state: present
    extra_args: --user
    break_system_packages: true
  when:
    - dotfiles_pip_package_ids | length > 0


# Flatpak
- name: Warn about ignored Flatpak applications on headless machines
  ansible.builtin.debug:
    msg: >-
      Ignoring Flatpak applications on headless machine:
      {{ dotfiles_flatpak_package_ids | join(', ') }}
  when:
    - dotfiles_machine_type != "gui"
    - dotfiles_flatpak_package_ids | length > 0


- name: Check whether Flatpak is available
  ansible.builtin.command:
    argv:
      - flatpak
      - --version
  register: dotfiles_flatpak_available
  changed_when: false
  failed_when: false
  when:
    - dotfiles_machine_type == "gui"
    - dotfiles_flatpak_package_ids | length > 0


- name: Add Flatpak remotes for this user
  ansible.builtin.command:
    argv:
      - flatpak
      - remote-add
      - --if-not-exists
      - --user
      - "{{ item.name }}"
      - "{{ item.url }}"
  register: dotfiles_flatpak_remote
  changed_when: >-
    'already exists'
    not in (dotfiles_flatpak_remote.stderr | default(''))
  loop: "{{ dotfiles_flatpak_remotes }}"
  when:
    - dotfiles_machine_type == "gui"
    - dotfiles_flatpak_package_ids | length > 0
    - dotfiles_flatpak_available.rc | default(1) == 0


- name: Check selected Flatpak applications
  ansible.builtin.command:
    argv:
      - flatpak
      - info
      - --user
      - "{{ dotfiles_flatpak_package_catalog[item].ref }}"
  register: dotfiles_flatpak_info
  changed_when: false
  failed_when: false
  loop: "{{ dotfiles_flatpak_package_ids }}"
  when:
    - dotfiles_machine_type == "gui"
    - dotfiles_flatpak_package_ids | length > 0
    - dotfiles_flatpak_available.rc | default(1) == 0


- name: Install missing Flatpak applications
  ansible.builtin.command:
    argv:
      - flatpak
      - install
      - --user
      - --assumeyes
      - "{{ dotfiles_flatpak_package_catalog[item.item].remote }}"
      - "{{ dotfiles_flatpak_package_catalog[item.item].ref }}"
  loop: "{{ dotfiles_flatpak_info.results | default([]) }}"
  when:
    - dotfiles_machine_type == "gui"
    - dotfiles_flatpak_available.rc | default(1) == 0
    - item.rc != 0
