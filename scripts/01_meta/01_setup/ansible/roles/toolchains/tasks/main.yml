---
- name: Ensure toolchain directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ dotfiles_home }}/.local/bin"
    - "{{ dotfiles_home }}/.local/share"

- name: Get latest fnm release
  ansible.builtin.uri:
    url: https://api.github.com/repos/Schniz/fnm/releases/latest
    return_content: true
    headers:
      Accept: application/vnd.github+json
  register: fnm_release
  changed_when: false

- name: Determine fnm architecture
  ansible.builtin.set_fact:
    fnm_asset: >-
      {{
        'fnm-linux.zip'
        if ansible_facts.architecture == 'x86_64'
        else 'fnm-arm64.zip'
        if ansible_facts.architecture in ['aarch64', 'arm64']
        else 'unsupported'
      }}

- name: Validate fnm architecture
  ansible.builtin.assert:
    that:
      - fnm_asset != "unsupported"
    fail_msg: "Unsupported fnm architecture: {{ ansible_facts.architecture }}"

- name: Check installed fnm version
  ansible.builtin.command:
    cmd: "{{ dotfiles_home }}/.local/share/fnm/fnm --version"
  register: fnm_installed
  changed_when: false
  failed_when: false

- name: Install latest fnm
  when: >-
    fnm_installed.rc != 0
    or fnm_release.json.tag_name
       not in fnm_installed.stdout
  block:
    - name: Download fnm {{ fnm_release.json.tag_name }}
      ansible.builtin.get_url:
        url: >-
          https://github.com/Schniz/fnm/releases/download/{{
            fnm_release.json.tag_name
          }}/{{ fnm_asset }}
        dest: /tmp/fnm.zip
        mode: "0644"

    - name: Ensure fnm directory exists
      ansible.builtin.file:
        path: "{{ dotfiles_home }}/.local/share/fnm"
        state: directory
        mode: "0755"

    - name: Extract fnm
      ansible.builtin.unarchive:
        src: /tmp/fnm.zip
        dest: "{{ dotfiles_home }}/.local/share/fnm"
        remote_src: true

    - name: Install default node version
      ansible.builtin.command:
        cmd: "{{ dotfiles_home }}/.local/share/fnm/fnm install {{ dotfiles_node_lts_major }}"
      environment:
        FNM_DIR: "{{ dotfiles_home }}/.local/share/fnm"
      changed_when: false

    - name: Set default node version
      ansible.builtin.command:
        cmd: "{{ dotfiles_home }}/.local/share/fnm/fnm default {{ dotfiles_node_lts_major }}"
      environment:
        FNM_DIR: "{{ dotfiles_home }}/.local/share/fnm"
      changed_when: false

- name: Check whether uv is installed
  ansible.builtin.stat:
    path: "{{ dotfiles_home }}/.local/bin/uv"
  register: dotfiles_uv_bin
  when: dotfiles_install_uv | bool

- name: Install uv
  ansible.builtin.shell: |
    set -euo pipefail
    curl -LsSf https://astral.sh/uv/install.sh | sh
  args:
    executable: /bin/bash
  environment:
    UV_NO_MODIFY_PATH: "1"
  when:
    - dotfiles_install_uv | bool
    - not dotfiles_uv_bin.stat.exists

- name: Check whether rustup is installed
  ansible.builtin.stat:
    path: "{{ dotfiles_home }}/.local/share/cargo/bin/rustup"
  register: dotfiles_rustup_bin
  when: dotfiles_install_heavy_dev | bool

- name: Install Rust stable toolchain
  ansible.builtin.shell: |
    set -euo pipefail
    export CARGO_HOME="{{ dotfiles_home }}/.local/share/cargo"
    export RUSTUP_HOME="{{ dotfiles_home }}/.local/share/rustup"
    curl https://sh.rustup.rs -sSf | sh -s -- -y --no-modify-path
  args:
    executable: /bin/bash
  when:
    - dotfiles_install_heavy_dev | bool
    - not dotfiles_rustup_bin.stat.exists

- name: Ensure Rust stable toolchain is current
  ansible.builtin.command:
    cmd: "{{ dotfiles_home }}/.local/share/cargo/bin/rustup toolchain install stable"
  environment:
    CARGO_HOME: "{{ dotfiles_home }}/.local/share/cargo"
    RUSTUP_HOME: "{{ dotfiles_home }}/.local/share/rustup"
  changed_when: false
  when: dotfiles_install_heavy_dev | bool

- name: Check whether Go is installed
  ansible.builtin.stat:
    path: "{{ dotfiles_home }}/.local/share/go/bin/go"
  register: dotfiles_go_bin
  when: dotfiles_install_heavy_dev | bool

- name: Install latest Go release
  ansible.builtin.shell: |
    set -euo pipefail
    arch="$(uname -m)"
    case "${arch}" in
      x86_64) go_arch="amd64" ;;
      aarch64|arm64) go_arch="arm64" ;;
      *) echo "unsupported architecture: ${arch}" >&2; exit 1 ;;
    esac
    fname="$(curl -fsSL 'https://go.dev/dl/?mode=json' | grep -o "go[0-9.]*.linux-${go_arch}.tar.gz" | head -n 1)"
    rm -rf "{{ dotfiles_home }}/.local/share/go"
    curl -fsSL "https://go.dev/dl/${fname}" | tar -C "{{ dotfiles_home }}/.local/share" -xzf -
  args:
    executable: /bin/bash
  when:
    - dotfiles_install_heavy_dev | bool
    - not dotfiles_go_bin.stat.exists

- name: Write Go shell environment helper
  ansible.builtin.copy:
    dest: "{{ dotfiles_home }}/.local/share/go/env"
    mode: "0644"
    content: |
      #!/bin/sh
      case ":${PATH}:" in
          *:"$HOME/.local/share/go/bin":*)
              ;;
          *)
              export PATH="$HOME/.local/share/go/bin:$PATH"
              ;;
      esac
  when: dotfiles_install_heavy_dev | bool

- name: Install selected cargo applications
  ansible.builtin.shell: |
    set -euo pipefail
    export CARGO_HOME="{{ dotfiles_home }}/.local/share/cargo"
    export RUSTUP_HOME="{{ dotfiles_home }}/.local/share/rustup"

    "{{ dotfiles_home }}/.local/share/cargo/bin/cargo" \
      +stable install \
      --git "{{ dotfiles_cargo_package_catalog[item].git }}" \
      --root "{{ dotfiles_home }}/.local"
  args:
    executable: /bin/bash
    creates: "{{ dotfiles_cargo_package_catalog[item].creates }}"
  loop: "{{ dotfiles_cargo_package_ids | default([]) }}"
  when:
    - dotfiles_install_heavy_dev | bool
